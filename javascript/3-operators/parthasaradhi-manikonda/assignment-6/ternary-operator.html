<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TernaryOperator</title>
    <script src="scripts/ternary-operator.js" defer></script>
  </head>
  <body>
    <h3>Eligibility check with TernaryOperator</h3>

      type="text"
      id="first-name"
      name="first-name"
      placeholder="Enter yout first-name"
    /><br /><br />
    <input

    <p id="result"></p>
