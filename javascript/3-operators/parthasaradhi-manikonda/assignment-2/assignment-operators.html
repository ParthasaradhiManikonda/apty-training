<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arithmetic-assignment-operators</title>
    <style>
      div {
        background-color: rgb(226, 223, 223);
        width: 300px;
        text-align: center;
        height: 300px;
        margin-left: auto;
        margin-right: auto;
      }
    </style>
    <script src="scripts/assignment-operators.js" defer></script>
  </head>

  <body>
    <div id="calculator-app">
      <h1>Calculator app with arthimetic assignment operators</h1>
      <input type="number" id="input-number-1" /><br /><br />
      <input type="number" id="input-number-2" /><br />
      <p>select the operator</p>
      <button id="addition">+</button>
      <button id="subtraction">-</button>
      <button id="multiplication">*</button>
      <button id="division">/</button>
      <button id="modulus">%</button>
      <button id="increment">++</button>
      <button id="decrement">--</button>
      <p id="result"></p>
    </div>
  </body>
</html>
