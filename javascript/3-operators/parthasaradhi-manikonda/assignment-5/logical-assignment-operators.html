<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Logical-Assignment-Operators</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    label, input, select {
      margin: 5px 0;
    }
    button {
      margin: 5px;
      padding: 5px 10px;
    }
  </style>
  <script src="scripts/logical-assignment-operators.js"></script>
</head>
<body>
  <h2>Logical Assignment Operators</h2>

  <label>Value 1:</label>
  <input type="text" id="value1" />
  <select id="type1">
    <option value="string">String</option>
    <option value="number">Number</option>
    <option value="boolean">Boolean</option>
  </select>
  <br><br>

  <label>Value 2:</label>
  <input type="text" id="value2" />
  <select id="type2">
    <option value="string">String</option>
    <option value="number">Number</option>
    <option value="boolean">Boolean</option>
  </select>
  <br><br>

  <div>
    <button onclick="logicalAndAssign()">AND Assignment (&&=)</button>
    <button onclick="logicalOrAssign()">OR Assignment (||=)</button>
    <button onclick="nullishAssign()">Nullish Assignment (??=)</button>
  </div>

  <p id="result"></p>
</body>
</html>
