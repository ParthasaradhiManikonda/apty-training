<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessing and Manipulating iFrame Elements</title>
    <style>
      button {
        margin: 5px;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <h2>Accessing and Manipulating iFrame Elements</h2>

    <!-- Buttons OUTSIDE the iframe -->
    <div>
      <button id="changeColorBtn">Change Random Text Color</button>
      <button id="toggleBgBtn">Toggle Background</button>
      <button id="changeSpanBtn">Change Span Text</button>
      <button id="toggleDisableBtn">Toggle Disable</button>
      <button id="addAttrBtn">Add New Attribute</button>
    </div>

    <!-- Iframe to hold the Assignment 1 content -->
    <iframe id="contentFrame" width="100%" height="400"></iframe>

    <script src="scripts/manipulating-iframe.js"></script>
  </body>
</html>
