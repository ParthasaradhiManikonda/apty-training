<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle Visibility of Divs</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .toggle-div {
        padding: 20px;
        margin: 10px 0;
        background-color: lightblue;
        border: 1px solid #888;
      }
      button {
        padding: 8px 16px;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <h2>Toggle Visibility of Divs</h2>

    <button id="toggleBtn">Toggle Divs</button>

    <div class="toggle-div">Div 1 Content</div>
    <div class="toggle-div">Div 2 Content</div>
    <div class="toggle-div">Div 3 Content</div>

    <script src="scripts/toggle-visibility.js"></script>
  </body>
</html>
