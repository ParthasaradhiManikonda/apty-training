<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move iFrame Table Rows</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      iframe {
        width: 100%;
        height: 400px;
        border: 1px solid #888;
        margin-top: 10px;
      }
      button {
        margin: 4px;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <h2>Move Table Rows Inside iFrame</h2>

    <p>
      Select Row:
      <select id="rowSelector"></select>
    </p>
    <button id="upBtn">Up</button>
    <button id="downBtn">Down</button>
    <button id="topBtn">Top</button>
    <button id="bottomBtn">Bottom</button>

    <iframe id="myIframe"></iframe>

    <script src="scripts/moving-iframe-elements.js"></script>
  </body>
</html>
