<!DOCTYPE html>
<html>
  <head>
    <title>Array splicing</title>
  </head>
  <body>
    <h2>Color Array Operations</h2>

    <label for="colorInput">Initial Array (comma-separated):</label><br />
    <input
      type="text"
      id="colorInput"
      value="Red, Blue, Green, Yellow"
    /><br /><br />

    <button id="replaceBtn">Replace "Blue" with "Purple"</button>
    <button id="addBtn">Add "Orange" after "Yellow"</button>
    <button id="removeBtn">Remove "Green"</button>

    <h3>Result:</h3>
    <div id="result"></div>

    <script src="scripts/splice.js"></script>
  </body>
</html>
