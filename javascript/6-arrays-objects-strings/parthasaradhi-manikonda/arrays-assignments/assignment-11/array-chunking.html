    <title>Array Chunking</title>
  </head>
  <body>
    <h2>Array Chunking</h2>

    <br /><br />

    <label for="chunkSize">Enter chunk size:</label>

    <br /><br />

    <button id="chunkBtn">Chunk Array</button>

    <p id="output"><strong>Output:</strong></p>

    <script src="scripts/array-chunking.js"></script>
