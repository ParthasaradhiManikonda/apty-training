<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Stack</title>
  </head>
  <body>
    <h3>Stack Data Structure</h3>

    <label for="stackInput">Enter number to push into the stack:</label>
    <input type="number" id="stackInput" />

    <button id="pushNum">Push into stack</button>
    <button id="popNum">Pop from stack</button>
    <button id="topElement">Get top of the stack</button>

    <p id="pushResult"></p>
    <p id="popResult"></p>
    <p id="topResult"></p>

    <script src="scripts/stack.js"></script>
  </body>
</html>
