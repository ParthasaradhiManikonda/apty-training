<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Array Sorting</title>
  </head>
  <body>
    <h2>Sort Students by Score</h2>

    <label for="name">Student Name:</label>
    <input type="text" id="name" placeholder="Enter student name" />

    <label for="score">Score:</label>
    <input type="number" id="score" placeholder="Enter score" />

    <button id="addBtn">Add Student</button>
    <button id="sortBtn">Sort by Score</button>

    <p id="output"><strong>Output:</strong> []</p>

    <script src="scripts/custom-array-sorting.js"></script>
  </body>
</html>
