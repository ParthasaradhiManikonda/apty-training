<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Queue</title>
  </head>
  <body>
    <h3>Queue Data Structure</h3>

    <label for="queueInput">Enter number to enqueue:</label>
    <input type="number" id="queueInput" />

    <button id="enqueueBtn">Add</button>
    <button id="dequeueBtn">Remove</button>
    <button id="frontBtn">Get front of the queue</button>

    <p id="enqueueResult"></p>
    <p id="dequeueResult"></p>
    <p id="frontResult"></p>

    <script src="scripts/queue.js"></script>
  </body>
</html>
