<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Every-and-some</title>
  </head>
  <body>
    <h2>Student Score Checker</h2>

    <label for="name">Student Name:</label>
    <input type="text" id="name" placeholder="Enter student name" />

    <label for="score">Score:</label>
    <input type="number" id="score" placeholder="Enter score" />

    <button id="addBtn">Add Student</button>
    <button id="checkBtn">Check Scores</button>

    <p><strong>Students:</strong></p>
    <ul id="studentList"></ul>

    <p><strong>Result:</strong> <span id="result">---</span></p>

    <script src="scripts/every-and-some.js"></script>
  </body>
</html>
