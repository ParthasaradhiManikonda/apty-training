<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting with Template Literals</title>
  </head>
  <body>
    <h2>Greet here</h2>

    <label for="name">Enter your name:</label><br />
    <input type="text" id="name" placeholder="e.g., John" /><br /><br />

    <label for="age">Enter your age:</label><br />
    <input type="number" id="age" placeholder="e.g., 25" /><br /><br />

    <button onclick="generateGreeting()">Generate Greeting</button>

    <h3>Output:</h3>
    <p id="output"></p>
    <script src="scripts/template-literal.js"></script>
  </body>
</html>
