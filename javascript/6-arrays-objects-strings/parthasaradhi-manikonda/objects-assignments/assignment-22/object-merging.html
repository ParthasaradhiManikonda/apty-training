<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Deep Merge Objects</title>
  </head>
  <body>
    <h2>Deep Merge Two Objects</h2>

    <label for="obj1">Enter Object 1 (in JSON format):</label><br />
    <textarea
      id="obj1"
      rows="4"
      cols="50"
      placeholder='e.g. { "a": 1, "b": { "x": 10 } }'
    ></textarea
    ><br /><br />

    <label for="obj2">Enter Object 2 (in JSON format):</label><br />
    <textarea
      id="obj2"
      rows="4"
      cols="50"
      placeholder='e.g. { "b": { "y": 20 }, "c": 3 }'
    ></textarea
    ><br /><br />

    <button onclick="handleMerge()">Merge</button>

    <h3>Merged Output:</h3>
    <pre id="output"></pre>

    <script src="scripts/object-merging.js"></script>
  </body>
</html>
