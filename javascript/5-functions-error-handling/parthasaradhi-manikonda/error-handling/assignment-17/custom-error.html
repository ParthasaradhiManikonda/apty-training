<!DOCTYPE html>
<html>
  <head>
    <title>Error-handling</title>
  </head>
  <body>
    <h2>Custom-Errors</h2>

    <form id="calcForm">
      <input type="text" id="num1" placeholder="Enter first number" />
      <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input type="text" id="num2" placeholder="Enter second number" />
      <button type="submit">Calculate</button>
    </form>

    <div id="output"></div>
    <script src="scripts/custom-error.js"></script>
  </body>
</html>
