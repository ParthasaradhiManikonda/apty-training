<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime-numbers</title>
  </head>
  <body>
    <h3>Prime numbers generator</h3>
    <label for="start-number">Enter the start number</label>
    <input
      id="start-number"
      type="number"
      placeholder="enter a valid number"
      min="1"
    /><br /><br /><br />
    <label for="end-number">Enter the end number</label>
    <input
      id="end-number"
      type="number"
      placeholder="enter a valid number"
    /><br /><br />
    <button id="resultBtn">generate</button>
    <p id="result"></p>
    <script src="scripts/prime-number.js"></script>
  </body>
</html>
