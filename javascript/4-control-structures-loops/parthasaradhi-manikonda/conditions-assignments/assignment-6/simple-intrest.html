<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple-Intrest-Calculator</title>
    <script src="scripts/simple-intrest.js" defer></script>
  </head>
  <body>
    <h3>Calculate your simple intrest</h3>
    <label for="principal-amount">Enter principal amount</label>
    <input
      type="number"
      id="principal-amount"
      placeholder="enter a valid number"
    /><br /><br /><br />
    <label for="time">Enter number of years</label>
    <input
      type="number"
      id="time"
      placeholder="enter in years"
    /><br /><br /><br />
    <label for="rate-of-intrest">Enter the rate of intrest</label>
    <input
      type="number"
      id="rate-of-intrest"
      placeholder="enter a valid number"
    /><br /><br /><br />
    <button id="checkbtn">Click to check you simple intrest</button>
    <p id="result"></p>
  </body>
</html>
