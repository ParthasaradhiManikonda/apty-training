<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leap-year-checker</title>
    <script src="scripts/leap-year.js" defer></script>
  </head>
  <body>
    <h3>Check whether leap year or not</h3>
    <label for="year-input">Enter the year :</label>
    <input
      type="number"
      id="year-input"
      placeholder=" enter a valid number"
    /><br /><br />
    <button id="check-result">Check leap year or not</button>
    <p id="year-result"></p>
  </body>
</html>
