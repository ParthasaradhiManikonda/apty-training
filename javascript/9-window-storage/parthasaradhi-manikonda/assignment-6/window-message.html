<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Window</title>
  </head>
  <body>
    <h1>Parent Window</h1>
    <iframe id="childFrame" src="child.html"></iframe>
    <div>
      <h3>Send message to iframe:</h3>
      <input type="text" id="parentMessage" placeholder="Type a message" />
      <button onclick="sendToChild()">Send to Child</button>
    </div>
    <div>
      <h3>Message from Child:</h3>
      <p id="fromChild">(no message yet)</p>
    </div>
    <script src="scripts/window-message.js"></script>
  </body>
</html>
